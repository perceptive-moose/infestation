name: Touch controls and room tips

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test touch input
        run: node tests/touch-controls.test.cjs
      - name: Test room tips
        run: node tests/touch-tips.test.cjs
      - name: Check browser shell syntax
        run: node --check js/touch-shell.js
