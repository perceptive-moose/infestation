name: Remove redundant commit-message attribution

on:
  push:
    branches: [history/rewrite-2026-11-02]
    paths:
      - .github/workflows/message-cleanup.yml

permissions:
  contents: write

concurrency:
  group: infestation-message-cleanup-2026-11-02
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'perceptive-moose/infestation' && github.actor == 'perceptive-moose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every commit changed only as requested
        run: python3 publish_message_cleanup.py
      - name: Preserve the previous history and publish with an exact lease
        run: python3 publish_message_cleanup.py --publish
