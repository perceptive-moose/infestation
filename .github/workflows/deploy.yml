name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/touch-tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --locked --target wasm32-unknown-unknown --release -p infestation --bin infestation

      - name: Prepare deployment
        run: |
          # Sprites, textures, fonts, sound effects and levels are embedded
          # in the WASM. Music streams from these relative MP3 paths.
          mkdir -p dist/assets/music
          cp index.html touch.css dist/
          cp -r js dist/
          cp assets/music/*.mp3 dist/assets/music/
          cp assets/sprites.png dist/assets/
          cp target/wasm32-unknown-unknown/release/infestation.wasm dist/
          sed -i 's|target/wasm32-unknown-unknown/release/||' \
            dist/index.html
          test -s dist/infestation.wasm
          test -s dist/js/gl.js
          test -s dist/js/sapp_jsutils.js
          test -s dist/js/audio.js
          test -s dist/js/touch-controls.js
          test -s dist/js/touch-shell.js
          test -s dist/js/touch-tips.js
          test -s dist/js/touch-state.js
          test -s dist/assets/sprites.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
